# Bio-NAS smoke: first-run GDC BRCA download (open-access) + toy NAS.
# Usage (from Bio-NAS/): docker compose up --build
# TCGA data/results persist on the host via ./data/tcga → /data/tcga.
# No GDC login / token required for open-access files.

services:
  bio-nas-demo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: bio-nas-demo:local
    environment:
      TCGA_SAMPLE_OUT: /data/tcga/BRCA
      # ~5–10 patients (clamped in download script).
      TCGA_SAMPLE_N_CASES: "8"
      # Soft cap (~80 MB); clinical + expression (+ small meth if available).
      TCGA_SAMPLE_MAX_BYTES: "83886080"
    volumes:
      - ./data/tcga:/data/tcga
    # One-shot job: download-if-needed → train/NAS → exit.
    restart: "no"

  # Live container logs UI: http://localhost:8080
  # Reads the Docker socket (Docker Desktop on Windows); stays up after bio-nas-demo exits.
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
