# Per-disease label registry for the Static MTL baseline.
# Maps cohort-specific source columns to canonical {phenotype, severity} labels.
#
# phenotype: 0 = Healthy, 1 = Diseased
# severity:  0..K-1 ordinal (missing → mask loss with severity = -1)
#
# Plan 01 inventory (docs/data/cohort_inventory.md): fifth comparative category is
# Epigenetic Aging, while this registry still has placeholder key `down_syndrome`.
# Do not invent severity maps here — resolve naming after cohort lock.

diseases:
  brca:
    id: brca
    name: Breast Invasive Carcinoma (TCGA-BRCA)
    # Plan 01 LOCKED primary: GDC project TCGA-BRCA (open Level-3).
    # Accession/source: portal.gdc.cancer.gov/projects/TCGA-BRCA; controlled BAM/raw → dbGaP phs000178 (optional).
    # Longitudinal alternate (not primary): AURORA US GSE209998/GSE212375; dbGaP phs002622.
    # See docs/data/cohort_inventory.md — do not invent severity maps beyond the TCGA stage map below.
    n_severity_classes: 4
    phenotype:
      source_columns:
        - sample_type
      mapping:
        "Solid Tissue Normal": 0
        "Primary Tumor": 1
        "Metastatic": 1
        "Recurrent Tumor": 1
    severity:
      source_columns:
        - ajcc_pathologic_tumor_stage
      mapping:
        "Stage I": 0
        "Stage IA": 0
        "Stage IB": 0
        "Stage II": 1
        "Stage IIA": 1
        "Stage IIB": 1
        "Stage III": 2
        "Stage IIIA": 2
        "Stage IIIB": 2
        "Stage IIIC": 2
        "Stage IV": 3
      missing_policy: mask  # severity = -1 when stage unavailable (e.g. normal samples)

  alzheimers:
    id: alzheimers
    name: Alzheimer's Disease
    # Plan 01 LOCKED primary: ADNI via LONI IDA (controlled; account + DUA).
    # Accession/source: https://adni.loni.usc.edu/data-samples/adni-data/
    # PoC molecular modality: blood EPIC DNA methylation (+ genotype + clinical/cognitive).
    # Alternate (unlocked): ROSMAP AMP-AD syn3219045 (Synapse DUC).
    # Exploratory: GEO GSE282742, GSE153712.
    # Account status (2026-07-27): ADNI/LONI account + DUA **in progress** (user applying).
    # Do not invent severity/phenotype maps beyond placeholders below.
    n_severity_classes: 4  # placeholder: CDR/MMSE severity bands TBD post-DUA schema
    phenotype:
      source_columns:
        - diagnosis  # placeholder — fill from ADNI clinical dictionary after DUA
      mapping: {}  # 0 = control, 1 = AD/MCI diseased — fill when cohort schema is wired
    severity:
      source_columns:
        - cdr_score  # placeholder
      mapping: {}  # ordinal 0..K-1 — fill when cohort schema is finalized
      missing_policy: mask

  rheumatoid_arthritis:
    id: rheumatoid_arthritis
    name: Rheumatoid Arthritis
    # inventory candidates: GEO GSE138747 (primary); GSE176168; GSE129705
    n_severity_classes: 4  # placeholder: DAS28 tiers TBD
    phenotype:
      source_columns:
        - diagnosis  # placeholder
      mapping: {}
    severity:
      source_columns:
        - das28_score  # placeholder
      mapping: {}
      missing_policy: mask

  type2_diabetes:
    id: type2_diabetes
    name: Type 2 Diabetes
    # inventory candidates: KORA F4/FF4 (PASST); GEO GSE184050; recount3 (ETL layer)
    n_severity_classes: 4  # placeholder: HbA1c brackets TBD
    phenotype:
      source_columns:
        - diagnosis  # placeholder
      mapping: {}
    severity:
      source_columns:
        - hba1c_percent  # placeholder
      mapping: {}
      missing_policy: mask

  down_syndrome:
    id: down_syndrome
    name: Down Syndrome
    # NOTE (Plan 01): inventory fifth category is Epigenetic Aging (LBC1936 EGAS00001000910;
    # SATSA E-MTAB-7309), not Down syndrome — naming mismatch deferred; no severity invent.
    n_severity_classes: 3  # placeholder: severity proxy TBD
    phenotype:
      source_columns:
        - diagnosis  # placeholder
      mapping: {}
    severity:
      source_columns:
        - severity_proxy  # placeholder
      mapping: {}
      missing_policy: mask
