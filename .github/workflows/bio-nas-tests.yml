name: Bio-NAS tests

on:
  push:
    paths:
      - "Bio-NAS/scripts/**"
      - "Bio-NAS/tests/**"
      - "Bio-NAS/phd_bio-nas_master_plan.md"
      - ".github/workflows/bio-nas-tests.yml"
  pull_request:
    paths:
      - "Bio-NAS/scripts/**"
      - "Bio-NAS/tests/**"
      - "Bio-NAS/phd_bio-nas_master_plan.md"
      - ".github/workflows/bio-nas-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bio-NAS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -v
